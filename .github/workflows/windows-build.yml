name: Windows x64 Desktop Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set build version and updater signing mode
        id: signing
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = "0.1.${{ github.run_number }}"
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 20 | Set-Content desktop/package.json
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          if ($env:TAURI_UPDATER_PUBLIC_KEY -and $env:TAURI_SIGNING_PRIVATE_KEY) {
            $config.bundle.createUpdaterArtifacts = $true
            $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
            "SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Signed updater artifacts enabled."
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            $config.plugins.updater.pubkey = ""
            "SIGNED_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Signing secrets are not configured; building installers without updater artifacts."
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content desktop/src-tauri/tauri.conf.json
      - name: Install scanner dependencies
        working-directory: desktop/engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build scanner sidecar
        shell: cmd
        run: desktop\scripts\build-scanner-windows.bat
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Generate Windows application icons
        working-directory: desktop
        run: npm run icons
      - name: Verify frontend build
        working-directory: desktop
        run: npm run build
      - name: Build and publish signed Tauri release
        if: steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v0.1.${{ github.run_number }}
          releaseName: DadaDevourer Desktop v0.1.${{ github.run_number }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true

      - name: Build and publish unsigned Tauri release
        if: steps.signing.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v0.1.${{ github.run_number }}
          releaseName: DadaDevourer Desktop v0.1.${{ github.run_number }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DadaDevourer-Windows-Installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
