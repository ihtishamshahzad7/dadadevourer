name: Windows x64 Desktop Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.4.0"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set build version and updater signing mode
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.version }}") {
            $releaseTag = "v${{ inputs.version }}"
          } else {
            throw "A release version is required."
          }
          $version = $releaseTag.TrimStart("v")
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 20 | Set-Content desktop/package.json
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $config.bundle.createUpdaterArtifacts = $true
            "SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Signed updater artifacts enabled."
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            $config.plugins.updater.pubkey = ""
            "SIGNED_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Signing secrets are not configured; building installers without updater artifacts."
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content desktop/src-tauri/tauri.conf.json
      - name: Install scanner dependencies
        working-directory: desktop/engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build scanner sidecar
        shell: cmd
        run: desktop\scripts\build-scanner-windows.bat
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Generate Windows application icons
        working-directory: desktop
        run: npm run icons
      - name: Verify frontend build
        working-directory: desktop
        run: npm run build
      - name: Build and publish signed Tauri release
        if: steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.signing.outputs.release_tag }}
          releaseName: DadaDevourer Desktop ${{ steps.signing.outputs.release_tag }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true

      - name: Build and publish unsigned Tauri release
        if: steps.signing.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ steps.signing.outputs.release_tag }}
          releaseName: DadaDevourer Desktop ${{ steps.signing.outputs.release_tag }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true

      - name: Verify Windows installer outputs
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "NSIS installer was not produced." }
          if (-not $msi) { throw "MSI installer was not produced." }
          Write-Host "NSIS installer: $($nsis.FullName)"
          Write-Host "MSI installer: $($msi.FullName)"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DadaDevourer-Windows-Installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Prepare release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.signing.outputs.release_tag }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $nsis = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found." }
          if (-not $msi) { throw "MSI installer not found." }
          Copy-Item $nsis.FullName "release-assets/DadaDevourer_x64-setup.exe"
          Copy-Item $msi.FullName "release-assets/DadaDevourer_x64.msi"

          if ($env:SIGNED_BUILD -eq "true") {
            $nsisSig = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
            $msiSig = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi.sig" | Select-Object -First 1
            if (-not $nsisSig) { throw "Signed NSIS signature was not produced." }
            if (-not $msiSig) { throw "Signed MSI signature was not produced." }

            Copy-Item $nsisSig.FullName "release-assets/DadaDevourer_x64-setup.exe.sig"
            Copy-Item $msiSig.FullName "release-assets/DadaDevourer_x64.msi.sig"

            $signature = (Get-Content $nsisSig.FullName -Raw).Trim()
            $manifest = [ordered]@{
              version = $env:RELEASE_TAG
              notes = "See release notes on GitHub"
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $signature
                  url = "https://github.com/ihtishamshzad7/dadadevourer/releases/download/$($env:RELEASE_TAG)/DadaDevourer_x64-setup.exe"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 10 | Set-Content "release-assets/latest.json" -Encoding utf8
            Write-Host "Generated signed updater manifest: release-assets/latest.json"
          } else {
            Write-Host "No updater manifest generated because signing secrets are unavailable."
          }

      - name: Publish signed DadaDevourer release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.signing.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: DadaDevourer ${{ steps.signing.outputs.release_tag }}
          body: |
            Self-contained Windows installer. No dependencies required.
            Signed updater artifacts are included for in-app updates.
          files: |
            release-assets/DadaDevourer_x64-setup.exe
            release-assets/DadaDevourer_x64.msi
            release-assets/DadaDevourer_x64-setup.exe.sig
            release-assets/DadaDevourer_x64.msi.sig
            release-assets/latest.json
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish unsigned DadaDevourer release
        if: steps.signing.outputs.signed != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.signing.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: DadaDevourer ${{ steps.signing.outputs.release_tag }}
          body: |
            Self-contained Windows installer. No dependencies required.
            Download DadaDevourer_x64-setup.exe and run it.
            Updater artifacts were skipped because signing secrets are not configured.
          files: |
            release-assets/DadaDevourer_x64-setup.exe
            release-assets/DadaDevourer_x64.msi
          overwrite_files: true
          fail_on_unmatched_files: true
