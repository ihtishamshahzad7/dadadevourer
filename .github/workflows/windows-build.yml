name: Windows x64 Desktop Build

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install scanner dependencies
        working-directory: desktop/engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build scanner sidecar
        working-directory: desktop/engine
        run: python -m PyInstaller --clean --noconfirm dadadevourer-scanner.spec

      - name: Stage x64 scanner sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries" | Out-Null
          Copy-Item "desktop/engine/dist/dadadevourer-scanner.exe" "desktop/src-tauri/binaries/dadadevourer-scanner-x86_64-pc-windows-msvc.exe" -Force

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri installers
        working-directory: desktop
        run: npm run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: DadaDevourer-Windows-x64-NSIS
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: DadaDevourer-Windows-x64-MSI
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
