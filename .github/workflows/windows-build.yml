name: Windows x64 Desktop Build

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set build version and updater signing mode
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = "0.1.${{ github.run_number }}"
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 20 | Set-Content desktop/package.json
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          if ($env:TAURI_UPDATER_PUBLIC_KEY -and $env:TAURI_SIGNING_PRIVATE_KEY) {
            $config.bundle.createUpdaterArtifacts = $true
            $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
            "SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Signed updater artifacts enabled."
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            $config.plugins.updater.pubkey = ""
            "SIGNED_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Signing secrets are not configured; building installers without updater artifacts."
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content desktop/src-tauri/tauri.conf.json
      - name: Install scanner dependencies
        working-directory: desktop/engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build scanner sidecar
        working-directory: desktop/engine
        run: python -m PyInstaller --clean --noconfirm dadadevourer-scanner.spec
      - name: Stage x64 scanner sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries" | Out-Null
          Copy-Item "desktop/engine/dist/dadadevourer-scanner.exe" "desktop/src-tauri/binaries/dadadevourer-scanner-x86_64-pc-windows-msvc.exe" -Force
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v0.1.${{ github.run_number }}
          releaseName: DadaDevourer Desktop v0.1.${{ github.run_number }}
          generateReleaseNotes: true
          uploadUpdaterJson: ${{ env.SIGNED_BUILD == 'true' }}
          uploadUpdaterSignatures: ${{ env.SIGNED_BUILD == 'true' }}
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
